<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Παγκόσμιος Παλμός — Ειδήσεις & Σύνοψη</title>

  <!-- Εικονίδιο εφαρμογής (Favicon & Mobile Bookmark) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231e3a8a'/%3E%3Cstop offset='100%25' stop-color='%230284c7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23ffffff' stroke-width='2.5' opacity='0.9'/%3E%3Cellipse cx='32' cy='32' rx='9' ry='19' fill='none' stroke='%23ffffff' stroke-width='2' opacity='0.85'/%3E%3Cline x1='13' y1='32' x2='51' y2='32' stroke='%23ffffff' stroke-width='2' opacity='0.85'/%3E%3Crect x='26' y='26' width='24' height='20' rx='3' fill='%23f8fafc' stroke='%231e3a8a' stroke-width='2'/%3E%3Cline x1='30' y1='31' x2='46' y2='31' stroke='%230284c7' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='30' y1='36' x2='46' y2='36' stroke='%2364748b' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='30' y1='41' x2='40' y2='41' stroke='%2364748b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #1e3a8a;
      --accent: #0284c7;
      --border: #e2e8f0;
      --hover: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 760px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
      line-height: 1.6;
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .app-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 10px rgba(2, 132, 199, 0.25));
    }
    h1 {
      margin: 0;
      font-size: 1.65rem;
      color: var(--primary);
    }
    .subtitle {
      color: var(--muted);
      margin: 4px 0 0;
      font-size: 0.95rem;
    }
    .controls {
      background: var(--card);
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.2rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    select, button {
      font-size: 0.98rem;
      padding: 10px 14px;
      border-radius: 10px;
    }
    select {
      background: #f8fafc;
      border: 1px solid var(--border);
      color: var(--text);
      flex: 1;
      min-width: 190px;
      cursor: pointer;
    }
    .btn-main {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-main:hover { opacity: 0.92; }
    .btn-main:active { transform: scale(0.98); }
    
    .status {
      text-align: center;
      color: var(--muted);
      margin-bottom: 1.2rem;
      font-size: 0.9rem;
    }
    .news-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-item:hover {
      background: var(--hover);
      border-color: #cbd5e1;
    }
    .news-item.open {
      border-color: var(--accent);
      background: var(--card);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
    }
    .news-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .news-num {
      background: #e0f2fe;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.82rem;
      min-width: 26px;
      height: 26px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }
    .news-title {
      font-weight: 600;
      font-size: 1.02rem;
      flex: 1;
    }
    .chevron {
      color: var(--muted);
      font-size: 0.8rem;
      transition: transform 0.2s;
      margin-top: 4px;
    }
    .news-item.open .chevron {
      transform: rotate(180deg);
      color: var(--accent);
    }
    .news-details {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      cursor: default;
    }
    .news-item.open .news-details {
      display: block;
    }
    .news-details img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .news-summary {
      color: var(--muted);
      margin: 0 0 14px;
      font-size: 0.95rem;
    }
    .read-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0f9ff;
      color: var(--primary);
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .read-more:hover { background: #e0f2fe; }

    .load-more-container {
      text-align: center;
      margin-top: 1.8rem;
      display: none;
    }
    .btn-load {
      background: white;
      color: var(--primary);
      border: 1px solid var(--accent);
      padding: 10px 24px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.2s, color 0.2s;
    }
    .btn-load:hover {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <svg class="app-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1e3a8a"/>
          <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="16" fill="url(#logoGrad)"/>
      <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
      <ellipse cx="32" cy="32" rx="9" ry="19" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
      <line x1="13" y1="32" x2="51" y2="32" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
      <rect x="26" y="26" width="24" height="20" rx="3" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="30" y1="31" x2="46" y2="31" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="30" y1="36" x2="46" y2="36" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="30" y1="41" x2="40" y2="41" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>Παγκόσμιος Παλμός</h1>
    <p class="subtitle">Ειδήσεις & σύνοψη θεμάτων με ένα κλικ</p>
  </header>

  <div class="controls">
    <select id="countrySelect" aria-label="Επιλογή χώρας">
      <option value="cy">🇨🇾 Κύπρος</option>
      <option value="gr">🇬🇷 Ελλάδα</option>
      <option value="world">🌐 Όλος ο Κόσμος (Google News)</option>
      <option value="gb">🇬🇧 Ηνωμένο Βασίλειο</option>
      <option value="us">🇺🇸 ΗΠΑ</option>
      <option value="de">🇩🇪 Γερμανία</option>
      <option value="fr">🇫🇷 Γαλλία</option>
    </select>
    <button id="loadNewsBtn" class="btn-main">Φόρτωση</button>
  </div>

  <div id="statusMsg" class="status">Αυτόματος εντοπισμός τοποθεσίας...</div>
  <div id="newsContainer"></div>
  
  <div class="load-more-container" id="loadMoreContainer">
    <button id="loadMoreBtn" class="btn-load">Δείτε περισσότερα άρθρα (+15) ↓</button>
  </div>

  <script>
    const countrySelect = document.getElementById('countrySelect');
    const loadNewsBtn = document.getElementById('loadNewsBtn');
    const newsContainer = document.getElementById('newsContainer');
    const statusMsg = document.getElementById('statusMsg');
    const loadMoreContainer = document.getElementById('loadMoreContainer');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    let allArticlesData = [];
    let displayedCount = 0;
    const batchSize = 15;

    async function initApp() {
      try {
        const res = await fetch('https://api.country.is/');
        const data = await res.json();
        const code = data.country.toLowerCase();
        if ([...countrySelect.options].some(opt => opt.value === code)) {
          countrySelect.value = code;
        }
      } catch {
        // Διατηρείται η προεπιλογή
      }
      fetchNews();
    }

    async function fetchNews() {
      const country = countrySelect.value;
      const countryName = countrySelect.options[countrySelect.selectedIndex].text;

      statusMsg.textContent = `Φόρτωση ειδήσεων για: ${countryName}...`;
      newsContainer.innerHTML = '';
      loadMoreContainer.style.display = 'none';
      allArticlesData = [];
      displayedCount = 0;

      try {
        const res = await fetch(`/api/news?country=${country}`);
        if (!res.ok) throw new Error();
        allArticlesData = await res.json();

        if (allArticlesData.length === 0) {
          statusMsg.textContent = 'Δεν βρέθηκαν διαθέσιμα θέματα αυτή τη στιγμή.';
          return;
        }

        statusMsg.textContent = `Επιλέξτε ένα θέμα για σύνοψη και φωτογραφία (${countryName})`;
        renderBatch();

      } catch {
        statusMsg.textContent = 'Σφάλμα σύνδεσης. Δοκιμάστε ξανά.';
      }
    }

    function renderBatch() {
      const nextBatch = allArticlesData.slice(displayedCount, displayedCount + batchSize);
      
      nextBatch.forEach((article, index) => {
        const globalIndex = displayedCount + index + 1;
        const card = document.createElement('div');
        card.className = 'news-item';

        card.innerHTML = `
          <div class="news-header">
            <span class="news-num">${globalIndex}</span>
            <span class="news-title">${article.title}</span>
            <span class="chevron">▼</span>
          </div>
          <div class="news-details">
            ${article.image ? `<img src="${article.image}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
            <p class="news-summary">${article.summary || 'Δεν υπάρχει διαθέσιμη σύντομη περιγραφή για αυτό το άρθρο.'}</p>
            <a class="read-more" href="${article.link}" target="_blank" rel="noopener noreferrer">
              Περισσότερες πληροφορίες στην πηγή ↗
            </a>
          </div>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('a')) return;
          const isOpen = card.classList.contains('open');
          document.querySelectorAll('.news-item.open').forEach(el => el.classList.remove('open'));
          if (!isOpen) card.classList.add('open');
        });

        newsContainer.appendChild(card);
      });

      displayedCount += nextBatch.length;

      if (displayedCount < allArticlesData.length) {
        loadMoreContainer.style.display = 'block';
      } else {
        loadMoreContainer.style.display = 'none';
      }
    }

    loadMoreBtn.addEventListener('click', renderBatch);
    loadNewsBtn.addEventListener('click', fetchNews);
    countrySelect.addEventListener('change', fetchNews);
    
    initApp();
  </script>
</body>
</html>
