<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Παγκόσμιος Παλμός — Ειδήσεις & Σύνοψη</title>

  <!-- Εικονίδιο εφαρμογής για Browser, iPhone & Android Home Screen -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231e3a8a'/%3E%3Cstop offset='100%25' stop-color='%230284c7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23ffffff' stroke-width='2.5' opacity='0.9'/%3E%3Cellipse cx='32' cy='32' rx='9' ry='19' fill='none' stroke='%23ffffff' stroke-width='2' opacity='0.85'/%3E%3Cline x1='13' y1='32' x2='51' y2='32' stroke='%23ffffff' stroke-width='2' opacity='0.85'/%3E%3Crect x='26' y='26' width='24' height='20' rx='3' fill='%23f8fafc' stroke='%231e3a8a' stroke-width='2'/%3E%3Cline x1='30' y1='31' x2='46' y2='31' stroke='%230284c7' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='30' y1='36' x2='46' y2='36' stroke='%2364748b' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='30' y1='41' x2='40' y2='41' stroke='%2364748b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%231e3a8a'/%3E%3Cstop offset='100%25' stop-color='%230284c7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23ffffff' stroke-width='2.5' opacity='0.9'/%3E%3Cellipse cx='32' cy='32' rx='9' ry='19' fill='none' stroke='%23ffffff' stroke-width='2' opacity='0.85'/%3E%3Cline x1='13' y1='32' x2='51' y2='32' stroke='%23ffffff' stroke-width='2' opacity='0.85'/%3E%3Crect x='26' y='26' width='24' height='20' rx='3' fill='%23f8fafc' stroke='%231e3a8a' stroke-width='2'/%3E%3Cline x1='30' y1='31' x2='46' y2='31' stroke='%230284c7' stroke-width='2.5' stroke-linecap='round'/%3E%3Cline x1='30' y1='36' x2='46' y2='36' stroke='%2364748b' stroke-width='2' stroke-linecap='round'/%3E%3Cline x1='30' y1='41' x2='40' y2='41' stroke='%2364748b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">

  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --primary: #1e3a8a;
      --accent: #0284c7;
      --border: #e2e8f0;
      --hover: #f1f5f9;
      --star: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 780px;
      margin: 0 auto;
      padding: 1.5rem 1rem 4rem;
      line-height: 1.6;
    }
    header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 1.2rem;
    }
    .app-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 8px;
      filter: drop-shadow(0 4px 10px rgba(2, 132, 199, 0.25));
    }
    h1 {
      margin: 0;
      font-size: 1.65rem;
      color: var(--primary);
    }
    .subtitle {
      color: var(--muted);
      margin: 4px 0 0;
      font-size: 0.95rem;
    }
    
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 1rem;
      gap: 10px;
      flex-wrap: wrap;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 1;
    }
    select {
      font-size: 0.95rem;
      padding: 8px 12px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--border);
      color: var(--text);
      flex: 1;
      min-width: 200px;
      cursor: pointer;
    }
    
    /* Google Translate Styling */
    #google_translate_element { display: inline-block; }
    .goog-te-combo {
      padding: 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.9rem;
    }
    .goog-logo-link, .gsk-kiwi, .goog-te-gadget span { display: none !important; }
    body { top: 0 !important; }

    .status {
      text-align: center;
      color: var(--muted);
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    /* Κάρτες Ειδήσεων */
    .news-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .news-item:hover {
      background: var(--hover);
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    }
    .news-item.open {
      background: #ffffff;
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.08);
    }

    .news-item.cat-sport { border-left-color: #10b981; }
    .news-item.cat-economy { border-left-color: #f59e0b; }
    .news-item.cat-politics { border-left-color: #8b5cf6; }
    .news-item.cat-justice { border-left-color: #ef4444; }
    .news-item.cat-world { border-left-color: #3b82f6; }

    .news-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .news-badge {
      font-size: 1.3rem;
      min-width: 30px;
      text-align: center;
    }
    .news-meta-info {
      flex: 1;
    }
    .news-category-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 2px;
      display: block;
    }
    .news-title {
      font-weight: 600;
      font-size: 1.01rem;
      color: var(--text);
    }
    
    /* Κουμπί Αγαπημένων (Αστέρι) */
    .fav-btn {
      background: none;
      border: none;
      font-size: 1.35rem;
      cursor: pointer;
      color: #cbd5e1;
      padding: 4px 6px;
      line-height: 1;
      transition: transform 0.15s, color 0.15s;
    }
    .fav-btn:hover {
      transform: scale(1.15);
      color: var(--star);
    }
    .fav-btn.saved {
      color: var(--star);
    }

    .chevron {
      color: var(--muted);
      font-size: 0.78rem;
      transition: transform 0.2s;
      padding-left: 2px;
    }
    .news-item.open .chevron {
      transform: rotate(180deg);
      color: var(--accent);
    }
    .news-details {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      cursor: default;
    }
    .news-item.open .news-details {
      display: block;
    }
    .news-details img {
      width: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .news-summary {
      color: var(--muted);
      margin: 0 0 14px;
      font-size: 0.95rem;
    }
    .details-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .read-more {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f0f9ff;
      color: var(--primary);
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }
    .read-more:hover { background: #e0f2fe; }

    .load-more-container {
      text-align: center;
      margin-top: 1.8rem;
      display: none;
    }
    .btn-load {
      background: white;
      color: var(--primary);
      border: 1px solid var(--accent);
      padding: 10px 24px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.2s, color 0.2s;
    }
    .btn-load:hover {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <svg class="app-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1e3a8a"/>
          <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
      </defs>
      <rect width="64" height="64" rx="16" fill="url(#logoGrad)"/>
      <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9"/>
      <ellipse cx="32" cy="32" rx="9" ry="19" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
      <line x1="13" y1="32" x2="51" y2="32" stroke="#ffffff" stroke-width="2" opacity="0.85"/>
      <rect x="26" y="26" width="24" height="20" rx="3" fill="#f8fafc" stroke="#1e3a8a" stroke-width="2"/>
      <line x1="30" y1="31" x2="46" y2="31" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="30" y1="36" x2="46" y2="36" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
      <line x1="30" y1="41" x2="40" y2="41" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>Παγκόσμιος Παλμός</h1>
    <p class="subtitle">Ειδήσεις, σύνοψη & αυτόματη μετάφραση</p>
  </header>

  <div class="top-bar">
    <div class="controls">
      <select id="countrySelect" aria-label="Επιλογή χώρας ή αποθηκευμένων">
        <option value="cy">🇨🇾 Κύπρος</option>
        <option value="gr">🇬🇷 Ελλάδα</option>
        <option value="world">🌐 Όλος ο Κόσμος</option>
        <option value="gb">🇬🇧 Ηνωμένο Βασίλειο</option>
        <option value="us">🇺🇸 ΗΠΑ</option>
        <option value="de">🇩🇪 Γερμανία</option>
        <option value="fr">🇫🇷 Γαλλία</option>
        <option value="saved" id="savedOption">⭐ Αποθηκευμένα (0)</option>
      </select>
    </div>
    <div id="google_translate_element"></div>
  </div>

  <div id="statusMsg" class="status">Αυτόματος εντοπισμός τοποθεσίας & φόρτωση...</div>
  <div id="newsContainer"></div>
  
  <div class="load-more-container" id="loadMoreContainer">
    <button id="loadMoreBtn" class="btn-load">Δείτε περισσότερα άρθρα (+15) ↓</button>
  </div>

  <!-- Google Translate -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'el',
        includedLanguages: 'el,en,de,fr,it,es,ru,ar',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <script>
    const countrySelect = document.getElementById('countrySelect');
    const savedOption = document.getElementById('savedOption');
    const newsContainer = document.getElementById('newsContainer');
    const statusMsg = document.getElementById('statusMsg');
    const loadMoreContainer = document.getElementById('loadMoreContainer');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    const STORAGE_KEY = 'pagkosmios_palmos_saved';

    const RSS_SOURCES = {
      cy: ['https://www.philenews.com/feed/', 'https://www.sigmalive.com/rss'],
      gr: ['https://www.kathimerini.gr/infeeds/rss/nx-rss-feed.xml', 'https://www.naftemporiki.gr/feed/'],
      world: ['https://news.google.com/rss?hl=el&gl=GR&ceid=GR:el'],
      gb: ['https://feeds.bbci.co.uk/news/uk/rss.xml', 'https://www.theguardian.com/uk/rss'],
      us: ['https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml', 'https://feeds.npr.org/1001/rss.xml'],
      de: ['https://www.tagesschau.de/infoservices/alle-meldungen-100~rss2.xml'],
      fr: ['https://www.france24.com/fr/rss']
    };

    let allArticlesData = [];
    let displayedCount = 0;
    const batchSize = 15;

    // Διαχείριση Αποθηκευμένων Άρθρων (localStorage)
    function getSavedArticles() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function updateSavedCounter() {
      const count = getSavedArticles().length;
      savedOption.textContent = `⭐ Αποθηκευμένα (${count})`;
    }

    function isArticleSaved(link) {
      return getSavedArticles().some(item => item.link === link);
    }

    function toggleSaveArticle(article, btnElement, cardElement) {
      let saved = getSavedArticles();
      const index = saved.findIndex(item => item.link === article.link);

      if (index > -1) {
        saved.splice(index, 1);
        btnElement.classList.remove('saved');
        btnElement.textContent = '☆';
        btnElement.title = 'Αποθήκευση άρθρου';
        // Αν είμαστε στην προβολή αποθηκευμένων, αφαιρείται άμεσα η κάρτα
        if (countrySelect.value === 'saved') {
          cardElement.remove();
          if (saved.length === 0) {
            statusMsg.textContent = 'Δεν έχετε αποθηκευμένα άρθρα ακόμη.';
          }
        }
      } else {
        saved.unshift(article);
        btnElement.classList.add('saved');
        btnElement.textContent = '★';
        btnElement.title = 'Αφαίρεση από τα αποθηκευμένα';
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      updateSavedCounter();
    }

    function categorizeNews(title) {
      const t = title.toLowerCase();
      if (t.includes('αθλητ') || t.includes('ποδόσφαιρ') || t.includes('μπάσκετ') || t.includes('ομάδ') || t.includes('αγών') || t.includes('goal') || t.includes('sport') || t.includes('football')) {
        return { icon: '⚽', name: 'Αθλητικά', class: 'cat-sport' };
      }
      if (t.includes('οικονομ') || t.includes('ευρώ') || t.includes('τραπεζ') || t.includes('αγορά') || t.includes('ακίνητ') || t.includes('μισθ') || t.includes('πληθωρισμ') || t.includes('economy') || t.includes('market')) {
        return { icon: '💼', name: 'Οικονομία', class: 'cat-economy' };
      }
      if (t.includes('κυβέρνησ') || t.includes('υπουργ') || t.includes('βουλ') || t.includes('πολιτικ') || t.includes('εκλογ') || t.includes('κόμμα') || t.includes('πρόεδρ') || t.includes('government') || t.includes('election')) {
        return { icon: '🏛️', name: 'Πολιτική', class: 'cat-politics' };
      }
      if (t.includes('αστυνομ') || t.includes('δικαστ') || t.includes('εγκλημα') || t.includes('φωτιά') || t.includes('τροχαίο') || t.includes('έρευνα') || t.includes('σύλληψ') || t.includes('police') || t.includes('court')) {
        return { icon: '⚖️', name: 'Κοινωνία & Δικαιοσύνη', class: 'cat-justice' };
      }
      if (t.includes('κόσμος') || t.includes('διεθν') || t.includes('παγκόσμ') || t.includes('ηπα') || t.includes('ευρώπ') || t.includes('πόλεμ') || t.includes('συμφωνία') || t.includes('world') || t.includes('europe')) {
        return { icon: '🌍', name: 'Διεθνή', class: 'cat-world' };
      }
      return { icon: '📰', name: 'Επικαιρότητα', class: 'cat-general' };
    }

    async function initApp() {
      updateSavedCounter();
      try {
        const res = await fetch('https://api.country.is/');
        const data = await res.json();
        const code = data.country.toLowerCase();
        if ([...countrySelect.options].some(opt => opt.value === code)) {
          countrySelect.value = code;
        }
      } catch {}
      fetchNews();
    }

    function cleanHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html || '';
      let text = tmp.textContent || tmp.innerText || '';
      text = text.replace(/\s+/g, ' ').trim();
      return text.length > 350 ? text.substring(0, 347) + '...' : text;
    }

    async function fetchNews() {
      const country = countrySelect.value;
      newsContainer.innerHTML = '';
      loadMoreContainer.style.display = 'none';
      allArticlesData = [];
      displayedCount = 0;

      // Αν ο χρήστης επέλεξε "Αποθηκευμένα"
      if (country === 'saved') {
        allArticlesData = getSavedArticles();
        if (allArticlesData.length === 0) {
          statusMsg.textContent = 'Δεν έχετε αποθηκευμένα άρθρα ακόμη. Πατήστε το αστέρι (☆) δίπλα σε οποιαδήποτε είδηση για να την κρατήσετε.';
          return;
        }
        statusMsg.textContent = `Εμφανίζονται ${allArticlesData.length} αποθηκευμένα άρθρα`;
        renderBatch();
        return;
      }

      const countryName = countrySelect.options[countrySelect.selectedIndex].text;
      const feeds = RSS_SOURCES[country] || RSS_SOURCES['cy'];

      statusMsg.textContent = `Φόρτωση ειδήσεων για: ${countryName}...`;

      try {
        const requests = feeds.map(feedUrl => 
          fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`)
            .then(r => r.json())
            .catch(() => null)
        );

        const results = await Promise.all(requests);
        const seenTitles = new Set();

        results.forEach(data => {
          if (data && data.status === 'ok' && Array.isArray(data.items)) {
            data.items.forEach(item => {
              const title = (item.title || '').trim();
              if (title && !seenTitles.has(title.toLowerCase())) {
                seenTitles.add(title.toLowerCase());
                
                let img = item.thumbnail || (item.enclosure && item.enclosure.link) || '';
                if (!img && item.description) {
                  const match = item.description.match(/<img[^>]+src=["']([^"']+)["']/i);
                  if (match) img = match[1];
                }

                const cat = categorizeNews(title);

                allArticlesData.push({
                  title: title,
                  summary: cleanHtml(item.description || item.content),
                  image: img,
                  link: item.link,
                  category: cat
                });
              }
            });
          }
        });

        if (allArticlesData.length === 0) {
          statusMsg.textContent = 'Δεν βρέθηκαν διαθέσιμα θέματα αυτή τη στιγμή.';
          return;
        }

        statusMsg.textContent = `Εμφανίζονται τα κορυφαία θέματα (${countryName}) — Πατήστε σε ένα για σύνοψη`;
        renderBatch();

      } catch {
        statusMsg.textContent = 'Σφάλμα σύνδεσης. Ελέγξτε το διαδίκτυο.';
      }
    }

    function renderBatch() {
      const nextBatch = allArticlesData.slice(displayedCount, displayedCount + batchSize);
      
      nextBatch.forEach((article) => {
        const card = document.createElement('div');
        card.className = `news-item ${article.category.class}`;
        const saved = isArticleSaved(article.link);

        card.innerHTML = `
          <div class="news-header">
            <span class="news-badge">${article.category.icon}</span>
            <div class="news-meta-info">
              <span class="news-category-tag">${article.category.name}</span>
              <span class="news-title">${article.title}</span>
            </div>
            <button type="button" class="fav-btn ${saved ? 'saved' : ''}" title="${saved ? 'Αφαίρεση από τα αποθηκευμένα' : 'Αποθήκευση άρθρου'}">
              ${saved ? '★' : '☆'}
            </button>
            <span class="chevron">▼</span>
          </div>
          <div class="news-details">
            ${article.image ? `<img src="${article.image}" alt="" loading="lazy" onerror="this.style.display='none'">` : ''}
            <p class="news-summary">${article.summary || 'Δεν υπάρχει διαθέσιμη σύντομη περιγραφή για αυτό το άρθρο.'}</p>
            <div class="details-actions">
              <a class="read-more" href="${article.link}" target="_blank" rel="noopener noreferrer">
                Περισσότερες πληροφορίες στην πηγή ↗
              </a>
            </div>
          </div>
        `;

        const favBtn = card.querySelector('.fav-btn');
        favBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleSaveArticle(article, favBtn, card);
        });

        card.addEventListener('click', (e) => {
          if (e.target.closest('a') || e.target.closest('.fav-btn')) return;
          const isOpen = card.classList.contains('open');
          document.querySelectorAll('.news-item.open').forEach(el => el.classList.remove('open'));
          if (!isOpen) card.classList.add('open');
        });

        newsContainer.appendChild(card);
      });

      displayedCount += nextBatch.length;

      if (displayedCount < allArticlesData.length) {
        loadMoreContainer.style.display = 'block';
      } else {
        loadMoreContainer.style.display = 'none';
      }
    }

    loadMoreBtn.addEventListener('click', renderBatch);
    countrySelect.addEventListener('change', fetchNews);
    
    initApp();
  </script>
</body>
</html>
